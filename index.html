    <title>Product-listed-Page</title>
    <link rel="stylesheet" href="plp.css">

    <div class="plpHeader">
        <button class="plpCartBtn">
            Cart(<span data-cart-count>0</span>)
        </button>
    </div>

    <!-- Drawer structure -->
    <div class="plpDrawer" data-drawer>
        <div class="plpDrawerContent">
            <button class="plpDrawerClose">X</button>
            <div class="plpDrawerBody"></div>
            <div class="plpDrawerFooter">
                Subtotal: <span data-cart-subtotal>₹0</span>
            </div>
        </div>
    </div>

    <div class="plpToast" data-toast style="display:none;">
